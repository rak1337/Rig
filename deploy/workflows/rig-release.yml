# Rig is not a Worker: it drives a keyboard over USB, so it ships as a macOS
# binary and runs on the machine the keyboard is plugged into. This builds and
# publishes it on a tag.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build (Apple silicon)
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p out
          tar -czf out/rig-macos-arm64.tar.gz -C target/release rig
          shasum -a 256 out/rig-macos-arm64.tar.gz > out/rig-macos-arm64.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: out/rig-macos-*
