<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rig — keyboard lighting in the browser</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#96ff78"/>
      <rect x="21" y="0" width="16" height="16" rx="4" fill="#82f565"/>
      <rect x="42" y="0" width="16" height="16" rx="4" fill="#6dea52"/>
      <rect x="63" y="0" width="16" height="16" rx="4" fill="#58e03f"/>
      <rect x="84" y="0" width="16" height="16" rx="4" class="off"/>
      <rect x="0" y="21" width="16" height="16" rx="4" fill="#82f565"/>
      <rect x="21" y="21" width="16" height="16" rx="4" class="off"/>
      <rect x="42" y="21" width="16" height="16" rx="4" class="off"/>
      <rect x="63" y="21" width="16" height="16" rx="4" class="off"/>
      <rect x="84" y="21" width="16" height="16" rx="4" fill="#3cc827"/>
      <rect x="0" y="42" width="16" height="16" rx="4" fill="#6dea52"/>
      <rect x="21" y="42" width="16" height="16" rx="4" fill="#58e03f"/>
      <rect x="42" y="42" width="16" height="16" rx="4" fill="#44d62c"/>
      <rect x="63" y="42" width="16" height="16" rx="4" fill="#3cc827"/>
      <rect x="84" y="42" width="16" height="16" rx="4" class="off"/>
      <rect x="0" y="63" width="16" height="16" rx="4" fill="#58e03f"/>
      <rect x="21" y="63" width="16" height="16" rx="4" class="off"/>
      <rect x="42" y="63" width="16" height="16" rx="4" class="off"/>
      <rect x="63" y="63" width="16" height="16" rx="4" fill="#35bb22"/>
      <rect x="84" y="63" width="16" height="16" rx="4" class="off"/>
      <rect x="0" y="84" width="16" height="16" rx="4" fill="#44d62c"/>
      <rect x="21" y="84" width="16" height="16" rx="4" class="off"/>
      <rect x="42" y="84" width="16" height="16" rx="4" class="off"/>
      <rect x="63" y="84" width="16" height="16" rx="4" class="off"/>
      <rect x="84" y="84" width="16" height="16" rx="4" fill="#26a018"/>
    </svg>
    <span class="wordmark">Rig</span>
  </div>
  <div class="bar-center">
    <span class="device-tab" id="device-tab">No keyboard linked</span>
  </div>
  <div class="bar-right">
    <span class="status-led" id="chip-led"></span>
    <span id="chip-status">Not connected</span>
  </div>
</header>

<main class="content">
  <p class="alert" id="alert" hidden></p>

  <div class="hero">
    <div class="ambient" id="ambient" aria-hidden="true"></div>
    <svg id="keyboard" viewBox="0 0 971 328" role="img" aria-label="Keyboard preview"></svg>
  </div>

  <div class="cards">
    <section class="card" aria-labelledby="fx-title">
      <h2 id="fx-title">Effect</h2>
      <div class="effects" role="radiogroup" aria-labelledby="fx-title" id="effects"></div>
      <button class="primary spaced" id="connect">Connect keyboard</button>
    </section>

    <section class="card" aria-labelledby="color-title">
      <h2 id="color-title">Color</h2>
      <div class="wheel-hold"><canvas id="wheel" width="176" height="176" aria-label="Color wheel"></canvas></div>
      <div class="color-line">
        <label class="hex" for="hex"><span aria-hidden="true">#</span>
          <input id="hex" maxlength="6" spellcheck="false" autocomplete="off" aria-label="Hex color"></label>
        <div class="palette" id="palette" role="group" aria-label="Saved colors"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="adj-title">
      <h2 id="adj-title">Adjust</h2>
      <div class="row">
        <label class="row-label" for="brightness">Brightness</label>
        <input type="range" id="brightness" min="0" max="100" value="80">
        <output id="brightness-out" for="brightness">80</output>
      </div>
      <div class="row" id="direction-row" hidden>
        <span class="row-label">Direction</span>
        <div class="segmented" id="direction">
          <button type="button" data-direction="1" aria-pressed="true">→</button>
          <button type="button" data-direction="2" aria-pressed="false">←</button>
        </div>
      </div>
      <div class="row" id="speed-row" hidden>
        <span class="row-label">Speed</span>
        <div class="segmented" id="speed">
          <button type="button" data-speed="1" aria-pressed="false">1</button>
          <button type="button" data-speed="2" aria-pressed="true">2</button>
          <button type="button" data-speed="3" aria-pressed="false">3</button>
          <button type="button" data-speed="4" aria-pressed="false">4</button>
        </div>
      </div>
      <p class="hint" id="hint">
        Lighting runs in this tab over WebHID. Keep it open while an effect
        animates; a still colour stays set after you close it.
      </p>
    </section>
  </div>
</main>

<script src="/hid.js"></script>
</body>
</html>
